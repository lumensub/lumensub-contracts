name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve dependencies
        # soroban-env-host 22 accepts any ed25519-dalek >= 2, but its test utilities do not
        # build against 3.x. Hold it at 2.x until upstream narrows the bound.
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build release Wasm
        run: cargo build --workspace --target wasm32v1-none --release
      - name: Report sizes
        run: ls -l target/wasm32v1-none/release/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
