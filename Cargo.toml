[workspace]
resolver = "2"
members = [
    "contracts/lumensub-types",
    "contracts/splitter",
    "contracts/subscription",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lumensub/lumensub-contracts"
publish = false

[workspace.dependencies]
soroban-sdk = "29.0.1"
lumensub-types = { path = "contracts/lumensub-types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
